# The app only. spikes/ is its own pnpm project with its own lockfile (M0).
packages: []

allowBuilds:
  better-sqlite3: true
  esbuild: true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  vue-demi: true
  # Ships prebuilt binaries; its postinstall only re-checks them.
  unrs-resolver: false

# Exact versions newer than pnpm's minimum release age at install time (the kit pin, ADR-0011).
minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.144'
  - '@playwright/test@1.64.1'
  - '@towerism/selfhost-kit@0.4.2'
  - playwright-core@1.64.1
  - playwright@1.64.1
