name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No secrets beyond GITHUB_TOKEN: every Discord call in CI goes to a fake.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests with the coverage gates, then the built app (pnpm build) driven over HTTP.
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  # The browser journey (Playwright) against the production build. Not a deploy gate: there is no deploy yet.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: mkdir -p test-results && pnpm test:e2e
      - name: Upload the report, traces and server log
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The image, through the kit's reusable workflow (ADR-0011): built once, smoke-tested, then published as
  # edge / sha-… from main and pr-<n> from this repository's PRs. Fork PRs only build and smoke-test.
  image:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: Towerism/selfhost-kit/.github/workflows/app-image.yml@4c453910482af10fad937ff27f3d72c8f31a3bf1 # v0.4.2
    with:
      # Must match deploy/unraid/tournament-genie.xml (test/unit/unraid-template.test.ts).
      image-name: ghcr.io/towerism/discord-pokemon-tournament-genie
      smoke-scripts: |
        test/docker/smoke.sh
        test/docker/restore-drill.sh
        test/docker/litestream.sh

  # X.Y.Z / X.Y / latest on the tested digest, then the git tag and Release (kit workflow). Off until the owner
  # sets the repository variable RELEASES_ENABLED=true after the first-release checklist in docs/deploy.md
  # (the Caddy round trip of ADR-0013 comes first). Rollback: pin the previous tag on Unraid.
  release:
    needs: [check, e2e, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASES_ENABLED == 'true'
    permissions:
      contents: write
      packages: write
    uses: Towerism/selfhost-kit/.github/workflows/app-release.yml@4c453910482af10fad937ff27f3d72c8f31a3bf1 # v0.4.2
    with:
      image-name: ghcr.io/towerism/discord-pokemon-tournament-genie
      digest: ${{ needs.image.outputs.digest }}
